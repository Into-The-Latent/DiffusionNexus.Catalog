name: Catalog release

on:
  push:
    tags: ['v[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Install dn-catalog
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/Little-God1983/index.json --name github-littlegod --username Little-God1983 --password "$PACKAGES_READ_TOKEN" --store-password-in-clear-text
          dotnet tool install -g DiffusionNexus.Installer.SDK.Catalog.Tool --prerelease
      - name: Baseline
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download --pattern manifest.json --dir baseline || true
      - name: Validate
        run: |
          if [ -f baseline/manifest.json ]; then dn-catalog validate . --online --baseline baseline/manifest.json; else dn-catalog validate . --online; fi
      - name: Pack
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dn-catalog pack . --out dist --version "$VERSION" --channel stable --commit "$GITHUB_SHA"
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/catalog.zip dist/manifest.json --title "Catalog $GITHUB_REF_NAME" --generate-notes
